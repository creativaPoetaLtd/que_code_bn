name: Deploy to Heroku

on:
  push:
    branches:
      - dev-2
  pull_request:
    branches:
      - dev-2
    types:
      - closed

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: test-and-build
    
    # Only run this job if the PR was merged (not just closed) or on direct push to dev-2
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Login to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo $HEROKU_API_KEY | heroku auth:token

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          # Create app if it doesn't exist
          heroku apps:info $HEROKU_APP_NAME || heroku apps:create $HEROKU_APP_NAME
          
          # Configure git for Heroku authentication
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Add Heroku remote with API key authentication
          git remote remove heroku || true
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_APP_NAME.git
          
          # Deploy
          git push heroku HEAD:main --force

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Run database migrations
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          echo "Running database migrations..."
          heroku run "pnpm run migrate" --app $HEROKU_APP_NAME
          echo "✅ Database migrations completed"

      - name: Run pending seeds
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          echo "Running pending seeds..."
          heroku run "pnpm run seed" --app $HEROKU_APP_NAME
          echo "✅ Seed execution completed"

      - name: Verify deployment health
        run: |
          echo "Checking application health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com/health)
          if [ $response -eq 200 ]; then
            echo "✅ Application is healthy (HTTP $response)"
          else
            echo "❌ Application health check failed (HTTP $response)"
            exit 1
          fi

  notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [test-and-build, deploy]
    if: always()
    
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "🚀 Deployment to Heroku completed successfully!"
            echo "🔗 Application URL: https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"
            echo "📊 Health Check: https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com/health"
          else
            echo "❌ Deployment to Heroku failed!"
            echo "Build Status: ${{ needs.test-and-build.result }}"
            echo "Deploy Status: ${{ needs.deploy.result }}"
            exit 1
          fi