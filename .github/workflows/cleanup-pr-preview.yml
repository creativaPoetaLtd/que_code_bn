name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]
    branches:
      - dev-2
      - main
      - develop

jobs:
  cleanup-preview:
    name: Cleanup Preview Deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate app name
        id: app-info
        run: |
          APP_NAME="${{ secrets.HEROKU_APP_NAME }}-pr-${{ github.event.number }}"
          APP_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
          APP_NAME=${APP_NAME:0:30}
          echo "app-name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Login to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo $HEROKU_API_KEY | heroku auth:token

      - name: Delete preview app
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          APP_NAME: ${{ steps.app-info.outputs.app-name }}
        run: |
          if heroku apps:info $APP_NAME >/dev/null 2>&1; then
            echo "Deleting preview app: $APP_NAME"
            heroku apps:destroy $APP_NAME --confirm $APP_NAME
            echo "✅ Preview app deleted successfully"
          else
            echo "ℹ️ Preview app $APP_NAME not found or already deleted"
          fi

      - name: Comment on PR
        uses: peter-evans/find-comment@v2
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Preview Deployment'

      - name: Update PR comment
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v3
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## 🚀 Preview Deployment
            
            🗑️ **Preview Cleaned Up**
            
            The preview deployment has been automatically deleted because this PR was ${{ github.event.pull_request.merged && 'merged' || 'closed' }}.
            
            ${{ github.event.pull_request.merged && '✅ Changes have been deployed to the main application.' || 'ℹ️ No further action needed.' }}
            
            ---
            *Generated by GitHub Actions • [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*