name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev-2
      - main
      - develop

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    
    # Skip if PR is draft
    if: github.event.pull_request.draft == false
    
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
      app-name: ${{ steps.deploy.outputs.app-name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Generate app name
        id: app-info
        run: |
          # Create a unique app name for this PR
          BASE_NAME="${{ secrets.HEROKU_APP_NAME }}"
          PR_NUMBER="${{ github.event.number }}"
          APP_NAME="${BASE_NAME}-pr-${PR_NUMBER}"
          
          # Heroku app names must be lowercase and contain only letters, numbers, and dashes
          APP_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g')
          
          # Truncate if too long (Heroku limit is 30 characters)
          APP_NAME=${APP_NAME:0:30}
          
          echo "Generated app name: $APP_NAME"
          echo "app-name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "preview-url=https://$APP_NAME.herokuapp.com" >> $GITHUB_OUTPUT

      - name: Setup Heroku CLI
        run: |
          # Download and install Heroku CLI
          wget -qO- https://cli-assets.heroku.com/install-ubuntu.sh | sh
          
          # Make sure it's in the PATH for subsequent steps
          echo "/usr/bin" >> $GITHUB_PATH
          
          # Test the installation (CLI installs to /usr/bin/heroku)
          /usr/bin/heroku --version

      - name: Configure Heroku for Docker
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          APP_NAME: ${{ steps.app-info.outputs.app-name }}
        run: |
          # Login to Heroku
          echo $HEROKU_API_KEY | /usr/bin/heroku auth:token
          
          # Check if app exists and get current stack
          if /usr/bin/heroku apps:info --app $APP_NAME > /dev/null 2>&1; then
            echo "App $APP_NAME exists, checking stack..."
            CURRENT_STACK=$(/usr/bin/heroku stack --app $APP_NAME | grep -E "^\*" | awk '{print $2}' || echo "unknown")
            echo "Current stack: $CURRENT_STACK"
            
            # Set stack to container if it's not already
            if [ "$CURRENT_STACK" != "container" ]; then
              echo "Setting stack to container..."
              /usr/bin/heroku stack:set container --app $APP_NAME
            else
              echo "Stack is already set to container"
            fi
          else
            echo "App $APP_NAME doesn't exist yet, will be created with container stack"
          fi

      - name: Prepare for deployment
        run: |
          # Debug git state
          echo "Current branch: $(git branch --show-current)"
          echo "Git status:"
          git status --porcelain
          echo "HEAD reference:"
          git rev-parse HEAD
          echo "Files in root directory:"
          ls -la
          
          # Clean any potential issues
          git clean -fd
          
          # Configure git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Verify we have the required files
          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi
          
          if [ ! -f "Procfile" ]; then
            echo "ERROR: Procfile not found!"
            exit 1
          fi
          
          echo "✅ All required files present"

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ steps.app-info.outputs.app-name }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          usedocker: true
          docker_heroku_process_type: web
          dontautocreate: false
          dontuseforce: false
          stack: "container"
        env:
          COREPACK_ENABLE_STRICT: "0"
          NODE_OPTIONS: "--max-old-space-size=512"

      - name: Set up database
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          APP_NAME: ${{ steps.app-info.outputs.app-name }}
        run: |
          # Login to Heroku (CLI is installed at /usr/bin/heroku)
          echo $HEROKU_API_KEY | /usr/bin/heroku auth:token
          
          # Check if PostgreSQL addon exists, if not create it
          if ! /usr/bin/heroku addons --app $APP_NAME | grep -q "heroku-postgresql"; then
            echo "Creating PostgreSQL database..."
            /usr/bin/heroku addons:create heroku-postgresql:essential-0 --app $APP_NAME --wait
          else
            echo "PostgreSQL database already exists"
          fi
          
          # Get the database URL from the addon
          DATABASE_URL=$(/usr/bin/heroku config:get DATABASE_URL --app $APP_NAME)
          echo "Database URL retrieved: ${DATABASE_URL:0:30}..."
          
          # Prepare all environment variables in a single command
          echo "Setting up all environment variables in one batch..."
          
          # Generate secrets
          SESSION_SECRET=$(openssl rand -base64 32)
          RANDOM_ACCESS_TOKEN=$(openssl rand -base64 32)
          
          # Set all environment variables at once to avoid multiple restarts
          /usr/bin/heroku config:set \
            NODE_ENV=production \
            DB_PROD_URL="$DATABASE_URL" \
            DATABASE_URL="$DATABASE_URL" \
            DB_DIALECT=postgres \
            DB_HOSTED_MODE=hosted \
            DEV_MODE=production \
            BASE_URL="https://$APP_NAME.herokuapp.com/api/v1" \
            SESSION_SECRET="$SESSION_SECRET" \
            ACCESS_TOKEN_SECRET="$RANDOM_ACCESS_TOKEN" \
            GOOGLE_CLIENT_ID="dummy-client-id-for-preview" \
            GOOGLE_CLIENT_SECRET="dummy-client-secret-for-preview" \
            --app $APP_NAME
          
          # Override with real secrets if they exist
          if [ -n "${{ secrets.ACCESS_TOKEN_SECRET }}" ]; then
            /usr/bin/heroku config:set ACCESS_TOKEN_SECRET="${{ secrets.ACCESS_TOKEN_SECRET }}" --app $APP_NAME
          fi
          
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            /usr/bin/heroku config:set \
              GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              --app $APP_NAME
          fi
          
          # Set optional environment variables if secrets exist (these are less critical)
          if [ -n "${{ secrets.CLOUDINARY_API_KEY }}" ]; then
            /usr/bin/heroku config:set \
              CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}" \
              CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}" \
              CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
              CLOUDINARY_FOLDER_NAME="${{ secrets.CLOUDINARY_FOLDER_NAME }}" \
              --app $APP_NAME
          fi
          
          if [ -n "${{ secrets.EMAIL }}" ]; then
            /usr/bin/heroku config:set \
              EMAIL="${{ secrets.EMAIL }}" \
              EMAIL_HOST="${{ secrets.EMAIL_HOST }}" \
              EMAIL_PASS="${{ secrets.EMAIL_PASS }}" \
              EMAIL_PORT="${{ secrets.EMAIL_PORT }}" \
              EMAIL_SECURE="${{ secrets.EMAIL_SECURE }}" \
              --app $APP_NAME
          fi
          
          # Wait for database to be ready
          echo "Waiting for database to be ready..."
          sleep 20

      - name: Run database migrations
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          APP_NAME: ${{ steps.app-info.outputs.app-name }}
        run: |
          # Login to Heroku (CLI is at /usr/bin/heroku)
          echo $HEROKU_API_KEY | /usr/bin/heroku auth:token
          
          echo "Running database migrations..."
          
          # Try migrations with retry logic
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Migration attempt $attempt/$max_attempts..."
            
            if /usr/bin/heroku run "npm run migrate" --app $APP_NAME; then
              echo "✅ Database migrations completed successfully"
              break
            elif [ $attempt -eq $max_attempts ]; then
              echo "❌ Database migrations failed after $max_attempts attempts"
              echo "Checking database status..."
              /usr/bin/heroku pg:info --app $APP_NAME || true
              echo "Recent app logs:"
              /usr/bin/heroku logs --tail --num 50 --app $APP_NAME || true
              exit 1
            else
              echo "Migration failed, retrying in 15 seconds..."
              sleep 15
              attempt=$((attempt + 1))
            fi
          done

      - name: Verify deployment
        env:
          APP_NAME: ${{ steps.app-info.outputs.app-name }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "Verifying deployment..."
          max_attempts=15
          attempt=1
          
          # Wait longer for app to fully start (app may restart once due to config changes)
          echo "Waiting for app to initialize after environment setup..."
          sleep 60
          
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts..."
            response=$(curl -s -o /dev/null -w "%{http_code}" https://$APP_NAME.herokuapp.com/health || echo "000")
            
            if [ "$response" = "200" ]; then
              echo "✅ Preview deployment successful!"
              echo "🔗 Preview URL: https://$APP_NAME.herokuapp.com"
              echo "📊 Health Check: https://$APP_NAME.herokuapp.com/health"
              echo "📚 API Docs: https://$APP_NAME.herokuapp.com/api-docs"
              break
            elif [ $attempt -eq $max_attempts ]; then
              echo "❌ Preview deployment failed after $max_attempts attempts (HTTP $response)"
              echo "Fetching app logs for debugging..."
              # Use correct path for Heroku CLI
              echo $HEROKU_API_KEY | /usr/bin/heroku auth:token
              /usr/bin/heroku logs --tail --num 100 --app $APP_NAME || true
              exit 1
            else
              echo "Waiting for app to start... (HTTP $response)"
              sleep 30
              attempt=$((attempt + 1))
            fi
          done

      - name: Set output for other jobs
        id: deploy
        run: |
          echo "app-name=${{ steps.app-info.outputs.app-name }}" >> $GITHUB_OUTPUT
          echo "preview-url=${{ steps.app-info.outputs.preview-url }}" >> $GITHUB_OUTPUT

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: always() && !cancelled()
    
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v2
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Preview Deployment'

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚀 Preview Deployment
            
            ${{ needs.deploy-preview.result == 'success' && '✅ **Deployment Successful**' || '❌ **Deployment Failed**' }}
            
            ${{ needs.deploy-preview.result == 'success' && format('
            **Preview URL:** [{0}]({0})
            **Health Check:** [{0}/health]({0}/health)
            **API Base:** [{0}/api/v1]({0}/api/v1)
            
            ### 📊 Quick Links
            - 🔍 [Health Status]({0}/health)
            - 📚 [API Documentation]({0}/api-docs)
            - 🗄️ [Database Status]({0}/api/v1)
            
            ### 🔧 App Details
            - **App Name:** `{1}`
            - **Branch:** `{2}`
            - **Commit:** [`{3}`](https://github.com/{4}/commit/{3})
            
            ### 🧪 Testing Your Changes
            ```bash
            # Test the health endpoint
            curl {0}/health
            
            # Test API endpoints
            curl {0}/api/v1
            ```
            
            > 💡 This preview will be automatically updated when you push new commits to this PR.
            > 🗑️ The preview app will be deleted when the PR is closed or merged.
            ', needs.deploy-preview.outputs.preview-url, needs.deploy-preview.outputs.app-name, github.head_ref, github.sha, github.repository) || format('
            **❌ Deployment Failed**
            
            Please check the [workflow logs]({0}) for detailed error information.
            
            ### Common Issues:
            - **Build Failures**: Check for linting or compilation errors
            - **Database Issues**: Verify migration files are correct
            - **Environment Variables**: Ensure all required secrets are set
            - **Resource Limits**: Check if you''ve reached Heroku app limits
            
            ### Troubleshooting:
            1. Review the workflow logs above
            2. Check if all GitHub secrets are properly configured
            3. Verify your Heroku account has sufficient resources
            4. Try pushing a new commit to retry the deployment
            ', format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id)) }}
            
            ---
            *Generated by GitHub Actions • [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*