<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueCode Chat Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 800px;

      .chat-container {
        display: flex;
        height: 500px;

      }
      .chat-sidebar {

      }
      .sidebar-tab.active {
        background-color: #4caf50;
        color: white;
      }
      .sidebar-content {
        flex: 1;
        overflow-y: auto;
      }
      .chat-main {
        width: 70%;

        flex-direction: column;
      }
      .chat-header {
        padding: 10px;
        background-color: #f5f5f5;
        border-bottom: 1px solid #ddd;
      }

        flex-grow: 1;

      }
      .message {

      }

      input {

        margin-right: 10px;
      }
      .chat-list-item {

        border-bottom: 1px solid #eee;

      .chat-list-item:hover {
        background-color: #f5f5f5;
      }
      .chat-list-item.active {
        background-color: #e6e6e6;
      }
      .chat-list-item.new-message {

      }
      .typing-indicator {

        color: #666;
        border-top: 1px solid #eee;
      }
      .invitation-item {

        border-bottom: 1px solid #eee;

      }
      .invitation-item:hover {
        background-color: #f5f5f5;
      }
      .invitation-actions {
        margin-top: 5px;
      }
      .invitation-actions button {
        margin-right: 5px;
        padding: 4px 8px;

      }
      .btn-accept {
        background-color: #4caf50;
      }
      .btn-decline {
        background-color: #f44336;
      }
      .btn-invite {
        background-color: #2196f3;
      }
      .btn-pending {
        background-color: #ff9800;
        cursor: not-allowed;
        opacity: 0.7;
      }
      .btn-respond {
        background-color: #9c27b0;
      }
      .btn-rejected {
        background-color: #757575;
        cursor: not-allowed;
        opacity: 0.7;
      }
      .user-status {
        font-size: 0.6em;
        margin-top: 2px;
        font-weight: bold;
      }
      .status-available {
        color: #4caf50;
      }
      .status-pending {
        color: #ff9800;
      }
      .status-received {
        color: #9c27b0;
      }
      .status-rejected {
        color: #757575;
      }
      .invitation-status {
        font-size: 0.7em;
        margin-top: 2px;

      }
      .status-accepted {
        color: #4caf50;
      }
      .status-declined {
        color: #f44336;
      }
      .status-expired {
        color: #9e9e9e;
      }
      .status-unknown {

      }
      .invitation-date {

        color: #999;

      }
      .user-item {
        padding: 8px;

      }
      .user-item:hover {

      }
      .user-info {

      }
      .user-name {
        font-weight: bold;
        font-size: 0.9em;
      }
      .user-email {
        font-size: 0.7em;
        color: #666;
      }

        padding: 20px;
        text-align: center;
        color: #666;
        font-style: italic;
      }
      .hidden {
        display: none;
      }
      .tab-content {
        height: 100%;
        overflow-y: auto;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>

          <div class="chat-sidebar">

                type="text"
                id="message-input"

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
      const API_URL = "http://localhost:5001/api/v1"; // Update with your server URL
      let authToken = "";
      let currentUser = null;
      let socket = null;
      let activeChatId = null;
      let typingTimeout = null;

      // Cookie utility functions
      const cookieUtils = {
        setCookie: function (name, value, days) {
          let expires = "";
          if (days) {
            const date = new Date();
            date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
            expires = "; expires=" + date.toUTCString();
          }
          document.cookie =
            name +
            "=" +
            encodeURIComponent(JSON.stringify(value)) +
            expires +
            "; path=/";
          console.log(`🍪 Cookie set: ${name}`);
        },

        getCookie: function (name) {
          const nameEQ = name + "=";
          const ca = document.cookie.split(";");
          for (let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === " ") c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) {
              try {
                return JSON.parse(
                  decodeURIComponent(c.substring(nameEQ.length, c.length))
                );
              } catch (e) {
                console.error("Error parsing cookie:", e);
                return null;
              }
            }
          }
          return null;
        },

        deleteCookie: function (name) {
          document.cookie = name + "=; Max-Age=-99999999; path=/";
          console.log(`🍪 Cookie deleted: ${name}`);
        },
      };

      // Check for saved credentials and auto-login
      function checkSavedCredentials() {
        const savedToken = cookieUtils.getCookie("authToken");
        const savedUser = cookieUtils.getCookie("currentUser");

        if (savedToken && savedUser) {
          console.log("🔄 Found saved credentials, attempting auto-login...");
          authToken = savedToken;
          currentUser = savedUser;

          // Update UI
          authStatus.textContent = currentUser.firstName
            ? `Logged in as ${currentUser.firstName} ${currentUser.lastName}`
            : "Logged in successfully";
          authStatus.style.color = "green";

          // Show/hide buttons
          loginBtn.style.display = "none";
          logoutBtn.style.display = "inline-block";

          // Show chat interface
          chatInterface.classList.remove("hidden");

          // Initialize socket connection and load chats
          initializeSocket();
          loadChats();

          return true;
        }
        return false;
      }

      // Add logout functionality
      function logout() {
        // Clear cookies
        cookieUtils.deleteCookie("authToken");
        cookieUtils.deleteCookie("currentUser");

        // Clear variables
        authToken = "";
        currentUser = null;
        activeChatId = null;

        // Reset UI
        authStatus.textContent = "";
        chatInterface.classList.add("hidden");

        // Show/hide buttons
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";

        // Clear form inputs
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
        document.getElementById("user-id-input").value = "";

        // Disconnect socket
        if (socket) {
          socket.disconnect();
        }

        console.log("🚪 Logged out successfully");
      }

      // DOM Elements
      const loginBtn = document.getElementById("login-btn");
      const logoutBtn = document.getElementById("logout-btn");
      const authStatus = document.getElementById("auth-status");
      const chatInterface = document.getElementById("chat-interface");
      const createChatBtn = document.getElementById("create-chat-btn");
      const refreshChatsBtn = document.getElementById("refresh-chats-btn");
      const showUsersBtn = document.getElementById("show-users-btn");
      const debugBtn = document.getElementById("debug-btn");
      const chatList = document.getElementById("chat-list");
      const messages = document.getElementById("messages");
      const messageForm = document.getElementById("message-form");
      const messageInput = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");
      const chatTitle = document.getElementById("chat-title");
      const typingIndicator = document.getElementById("typing-indicator");

      // Login
      loginBtn.addEventListener("click", async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const response = await fetch(`${API_URL}/auth/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();
          console.log("🎉 Login successful", data);

          if (response.ok) {
            // Set the auth token
            if (data.token) {
              authToken = data.token;

              // Extract user data based on the response format
              if (data.user) {
                // Check for nested structures in our specific API response
                if (data.user.dataValues) {
                  currentUser = { ...data.user.dataValues };
                  console.log(
                    "📋 Extracted user data from dataValues:",
                    currentUser
                  );
                } else {
                  currentUser = { ...data.user };
                }
              } else if (data.data) {
                currentUser = { ...data.data };
              } else if (data.userId || data.id) {
                // Create a minimal user object with just the ID
                currentUser = { id: data.userId || data.id };
              }

              // If we only have minimal user data, fetch the full profile
              if (!currentUser.firstName || !currentUser.lastName) {
                console.log(
                  "⚠️ Minimal user data in login response, fetching full profile..."
                );
                await fetchCurrentUser();
              }
            } else if (data.accessToken) {
              authToken = data.accessToken;
              currentUser = { ...(data.user || data.data) };
            }

            // Ensure currentUser has an id property
            if (
              currentUser &&
              !currentUser.id &&
              (currentUser.userId || currentUser._id)
            ) {
              currentUser.id = currentUser.userId || currentUser._id;
            }

            // Save token and user data to cookies for persistent session
            cookieUtils.setCookie("authToken", authToken, 7); // Save for 7 days
            cookieUtils.setCookie("currentUser", currentUser, 7);
            console.log("🔐 Credentials saved to cookies");

            authStatus.textContent =
              currentUser && currentUser.firstName
                ? `Logged in as ${currentUser.firstName} ${currentUser.lastName}`
                : "Logged in successfully";
            authStatus.style.color = "green";

            // Show/hide buttons
            loginBtn.style.display = "none";
            logoutBtn.style.display = "inline-block";

            // Show chat interface
            chatInterface.classList.remove("hidden");

            // Initialize Socket.IO
            initializeSocket();

            // Load user's chats
            loadChats();
          } else {
            authStatus.textContent = `Error: ${data.message}`;
            authStatus.style.color = "red";
          }
        } catch (error) {
          console.error("Login error:", error);
          authStatus.textContent = "Network error. Please try again.";
          authStatus.style.color = "red";
        }
      });

      // Logout button
      logoutBtn.addEventListener("click", () => {
        logout();
      });

      // Refresh chats button
      refreshChatsBtn.addEventListener("click", () => {
        console.log("🔄 Manually refreshing chats...");
        loadChats();
      });

      // Show users button for debugging
      showUsersBtn.addEventListener("click", async () => {
        try {
          console.log("🔍 Fetching all users...");
          const response = await fetch(`${API_URL}/users`, {
            headers: {
              Authorization: `Bearer ${authToken}`,
            },
          });

          if (response.ok) {
            const data = await response.json();
            console.log("👥 Available users:", data);

            let userList = "Available Users:\n";
            if (data.data && Array.isArray(data.data)) {
              data.data.forEach((user) => {
                userList += `ID: ${user.id} - ${user.firstName} ${user.lastName} (${user.email})\n`;
              });
            } else if (Array.isArray(data)) {
              data.forEach((user) => {
                userList += `ID: ${user.id} - ${user.firstName} ${user.lastName} (${user.email})\n`;
              });
            }

            alert(userList);
          } else {
            const errorData = await response.json().catch(() => ({}));
            console.error("Failed to fetch users:", errorData);
            alert(
              `Failed to fetch users: ${errorData.message || "Unknown error"}`
            );
          }
        } catch (error) {
          console.error("Error fetching users:", error);
          alert("Error fetching users. Check console for details.");
        }
      });

      // Fetch current user details if we only have userId
      async function fetchCurrentUser() {
        if (!authToken) {
          console.error("Cannot fetch user: No auth token available");
          return;
        }

        try {
          console.log("🔍 Fetching current user data...");
          const response = await fetch(`${API_URL}/users/me`, {
            headers: {
              Authorization: `Bearer ${authToken}`,
            },
          });

          if (response.ok) {
            const userData = await response.json();
            console.log("📋 Raw user data response:", userData);

            // Extract user data - the response should be the direct user object now
            const userDataObj = userData;

            // If we already have a currentUser object with an ID, merge the new data
            if (currentUser && currentUser.id) {
              const userId = currentUser.id;
              currentUser = { ...userDataObj, id: userId };
            } else {
              currentUser = userDataObj;
              // Ensure we have an id property
              if (!currentUser.id && (currentUser.userId || currentUser._id)) {
                currentUser.id = currentUser.userId || currentUser._id;
              }
            }

            console.log("✅ User data fetched:", currentUser);

            // Update auth status display with user info if available
            if (currentUser.firstName) {
              authStatus.textContent = `Logged in as ${currentUser.firstName} ${currentUser.lastName}`;
              authStatus.style.color = "green";
            }

            return true;
          } else {
            const errorData = await response.json().catch(() => ({}));
            console.error(
              "Failed to fetch user details:",
              errorData.message || "Unknown error"
            );
            return false;
          }
        } catch (error) {
          console.error("Failed to fetch user details:", error);
          return false;
        }
      }

      // Initialize Socket.IO
      function initializeSocket() {
        if (!authToken) {
          console.error(
            "Cannot initialize Socket.IO without authentication token"
          );
          return;
        }

        // Update connection status UI
        const connectionStatus = document.getElementById("connection-status");
        function updateConnectionStatus(status, color) {
          if (connectionStatus) {
            connectionStatus.innerHTML = `Connection: <span style="color: ${color};">${status}</span>`;
          }
        }

        updateConnectionStatus("Connecting...", "orange");

        console.log("🔌 Initializing Socket.IO connection...");
        socket = io(API_URL.replace("/api/v1", ""), {
          auth: { token: authToken },
          reconnection: true,
          reconnectionAttempts: 5,
          reconnectionDelay: 1000,
          reconnectionDelayMax: 5000,
          timeout: 20000,
        });

        // Socket event listeners
        socket.on("connect", () => {
          console.log("✅ Connected to Socket.IO");
          updateConnectionStatus("Connected", "green");

          // After connection, ensure we have user data
          if (!currentUser || !currentUser.id) {
            fetchCurrentUser().then(() => {
              if (currentUser && currentUser.id) {
                console.log("User data updated after socket connection");
              }
            });
          }

          // If there's an active chat, rejoin it
          if (activeChatId) {
            console.log(
              "🔄 Rejoining active chat after reconnection:",
              activeChatId
            );
            socket.emit("join_chat", { chatId: activeChatId });
          }
        });

        socket.on("disconnect", () => {
          console.warn("⚠️ Socket disconnected");
          updateConnectionStatus("Disconnected", "red");
        });

        socket.on("reconnect_attempt", (attemptNumber) => {
          console.log(`🔄 Reconnection attempt ${attemptNumber}...`);
          updateConnectionStatus(
            `Reconnecting (${attemptNumber})...`,
            "orange"
          );
        });

        socket.on("reconnect", (attemptNumber) => {
          console.log(

                notification.style.padding = "10px";
                notification.style.backgroundColor = "#ffdddd";
                notification.style.marginTop = "10px";
                notification.style.borderRadius = "5px";
                notification.textContent =
                  "Chat created but not visible in list. Try refreshing the chat list.";
                const refreshButton = document.createElement("button");
                refreshButton.textContent = "Refresh Chats";
                refreshButton.style.marginLeft = "10px";
                refreshButton.addEventListener("click", loadChats);
                notification.appendChild(refreshButton);
                document
                  .querySelector(".auth-container")
                  .appendChild(notification);
              }
            }, 800); // Increased timeout to ensure chats are loaded
          } else {
            console.error(
              "Failed to create chat, response status:",
              response.status
            );
            const errorData = await response.json().catch(() => ({}));
            console.error("Error response data:", errorData);
            alert(
              `Failed to create chat. ${
                errorData.message || "Please check the user ID."
              }`
            );
          }
        } catch (error) {
          console.error("Error creating chat:", error);
        }
      });

      // Load messages for a chat
      async function loadMessages(chatId) {
        try {
          console.log("📥 Loading messages for chat:", chatId);
          const response = await fetch(
            `${API_URL}/chats/${chatId}/messages?page=1&limit=50`,
            {
              headers: {
                Authorization: `Bearer ${authToken}`,
              },
            }
          );

          if (response.ok) {
            const result = await response.json();
            console.log("📥 Received messages response:", result);

            // The backend returns { message: "...", data: [...] }
            const messageData = result.data || result;
            console.log("📥 Processing message data:", messageData);
            renderMessages(messageData);
          } else {
            console.error("Failed to load messages, status:", response.status);
            const errorText = await response.text();
            console.error("Error response:", errorText);
          }
        } catch (error) {
          console.error("Error loading messages:", error);
        }
      }

      // Render messages
      function renderMessages(messageData) {
        console.log("🖼️ Rendering messages:", messageData);
        messages.innerHTML = "";

        if (!messageData || messageData.length === 0) {
          messages.innerHTML = '<div class="no-messages">No messages yet</div>';
          return;
        }

        // Sort messages by createdAt (oldest first)
        const sortedMessages = [...messageData].sort(
          (a, b) => new Date(a.createdAt) - new Date(b.createdAt)
        );

        console.log("🖼️ Sorted messages:", sortedMessages);

        sortedMessages.forEach((message) => {
          appendMessage(message);
        });

        // Scroll to bottom
        messages.scrollTop = messages.scrollHeight;
      }

      // Append a message to the messages container
      function appendMessage(message) {
        console.log("📝 Appending message:", message);
        console.log("📝 Current messages container:", messages);
        console.log(
          "📝 Messages container children before:",
          messages.children.length
        );

        const messageDiv = document.createElement("div");
        messageDiv.classList.add("message");

        // Add a unique identifier for debugging
        messageDiv.setAttribute("data-message-id", message.id);
        messageDiv.setAttribute("data-timestamp", message.createdAt);

        // Check if the message is from the current user
        if (message.senderId === currentUser.id) {
          messageDiv.classList.add("sent");
        } else {
          messageDiv.classList.add("received");

          // Add sender name for received messages
          if (message.sender) {
            const senderDiv = document.createElement("div");
            senderDiv.style.fontWeight = "bold";
            senderDiv.style.fontSize = "0.8em";
            senderDiv.style.color = "#666";
            senderDiv.style.marginBottom = "2px";
            senderDiv.textContent = `${message.sender.firstName || "Unknown"} ${
              message.sender.lastName || "User"
            }`;
            messageDiv.appendChild(senderDiv);
          }
        }

        const contentDiv = document.createElement("div");
        contentDiv.textContent = message.content;
        contentDiv.style.marginBottom = "4px";
        messageDiv.appendChild(contentDiv);

        // Add timestamp
        const timeDiv = document.createElement("div");
        timeDiv.style.fontSize = "0.7em";
        timeDiv.style.color = "#888";
        timeDiv.style.textAlign = "right";
        timeDiv.textContent = new Date(message.createdAt).toLocaleTimeString();
        messageDiv.appendChild(timeDiv);

        messages.appendChild(messageDiv);
        console.log(
          "📝 Message appended. Messages container children after:",
          messages.children.length
        );
        console.log("📝 Appended message element:", messageDiv);

        // Scroll to bottom
        messages.scrollTop = messages.scrollHeight;
        console.log("📝 Scrolled to bottom");

        // Add visual flash for real-time messages (temporary debugging)
        messageDiv.style.backgroundColor = "#ffeb3b";
        setTimeout(() => {
          messageDiv.style.backgroundColor = "";
        }, 1000);
      }

      // Send message
      messageForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const content = messageInput.value.trim();

        if (!content) {
          console.warn("⚠️ Cannot send empty message");
          return;
        }

        if (!activeChatId) {
          console.error("❌ No active chat selected");
          alert("Please select a chat first");
          return;
        }

        if (!socket || !socket.connected) {
          console.error("❌ Socket not connected");
          updateConnectionStatus(
            "Disconnected - Attempting to reconnect",
            "red"
          );

          // Attempt to reconnect
          initializeSocket();

          // Give it a moment to connect before trying again
          setTimeout(() => {
            if (socket && socket.connected) {
              alert("Reconnected! Please try sending your message again.");
            } else {
              alert(
                "Not connected to chat server. Please refresh the page and try again."
              );
            }
          }, 2000);
          return;
        }

        console.log(`📤 Sending message to chat ${activeChatId}: ${content}`);

        try {
          // Send via Socket.IO for real-time (we'll get the message back via socket)
          console.log("📤 About to emit send_message event");
          socket.emit("send_message", {
            chatId: activeChatId,
            content,
            messageType: "text",
          });

          console.log("✅ Message emitted to socket server:", content);
          console.log("✅ Socket connected:", socket.connected);
          console.log("✅ Socket ID:", socket.id);

          // Listen for acknowledgment (add a one-time listener)
          socket.once("error", (error) => {
            console.error("❌ Socket error after sending message:", error);
            alert(`Error: ${error.message || "Unknown error sending message"}`);
          });

          // Clear input
          messageInput.value = "";

          // Stop typing indicator
          socket.emit("typing_stop", { chatId: activeChatId });
        } catch (error) {
          console.error("Error sending message:", error);
          alert("Failed to send message. Please try again.");
        }
      });

      // Typing indicator
      messageInput.addEventListener("input", () => {
        if (!activeChatId) return;

        // Clear previous timeout
        if (typingTimeout) {
          clearTimeout(typingTimeout);
        }

        // Emit typing event
        socket.emit("typing_start", { chatId: activeChatId });

        // Set timeout to stop typing indicator
        typingTimeout = setTimeout(() => {
          socket.emit("typing_stop", { chatId: activeChatId });
        }, 2000);
      });

      // Debug button
      debugBtn.addEventListener("click", () => {
        // Detailed debug info
        console.log("🔍 DEBUG INFO:");
        console.log("- Auth token:", authToken ? "Present" : "Missing");
        console.log("- Current user:", currentUser);
        console.log("- Active chat ID:", activeChatId);
        console.log("- Socket connected:", socket?.connected);
        console.log("- Message input disabled:", messageInput.disabled);

        // Test message - send a test message if there's an active chat
        if (activeChatId && socket?.connected) {
          const testMessage = {
            chatId: activeChatId,
            content: "Test message from debug",
            messageType: "text",
          };

          console.log("📤 Sending test message:", testMessage);
          socket.emit("send_message", testMessage);
        }

        // Fix common issues
        if (messageInput.disabled && activeChatId) {
          messageInput.disabled = false;
          sendBtn.disabled = false;
          console.log("🔧 Fixed: Enabled message input");
        }

        // Reconnect socket if needed
        if (!socket?.connected) {
          console.log("🔄 Attempting to reconnect socket");
          initializeSocket();
        }
      });

      // Profile URL functionality event listeners

      // Copy profile URL button
      document.addEventListener("DOMContentLoaded", () => {
        const copyProfileBtn = document.getElementById("copy-profile-btn");
        if (copyProfileBtn) {
          copyProfileBtn.addEventListener("click", copyProfileUrl);
        }
      });

      // Send invitation button - direct invitation without validation
      document.addEventListener("DOMContentLoaded", () => {
        const sendInvitationBtn = document.getElementById(
          "send-invitation-btn"
        );
        if (sendInvitationBtn) {
          sendInvitationBtn.addEventListener("click", async () => {
            const profileUrlInput =
              document.getElementById("profile-url-input");
            const profileUrl = profileUrlInput.value.trim();

            if (!profileUrl) {
              alert("Please enter a profile URL");
              return;
            }

            try {
              await sendInvitationByProfileUrl(profileUrl);
            } catch (error) {
              console.error("Error sending invitation:", error);
            }

            try {
              await sendInvitationByProfileUrl(profileUrl);
            } catch (error) {
              console.error("Error sending invitation:", error);
            }
          });
        }
      });

      // Helper function to ensure socket connection
      async function ensureSocketConnection() {
        if (socket && socket.connected) {
          console.log("✅ Socket already connected");
          updateConnectionStatus("Connected", "green");
          return true;
        }

        console.log("🔄 Socket not connected, initializing...");
        initializeSocket();

        // Give it some time to connect
        return new Promise((resolve) => {
          let attempts = 0;
          const checkInterval = setInterval(() => {
            attempts++;

            if (socket && socket.connected) {
              console.log("✅ Socket connected after initialization");
              updateConnectionStatus("Connected", "green");
              clearInterval(checkInterval);
              resolve(true);
            } else if (attempts >= 5) {
              console.error(
                "❌ Failed to connect socket after multiple attempts"
              );
              updateConnectionStatus("Connection Failed", "red");
              clearInterval(checkInterval);
              resolve(false);
            } else {
              console.log(
                `🔄 Waiting for socket connection... (attempt ${attempts})`
              );
              updateConnectionStatus("Connecting...", "orange");
            }
          }, 1000);
        });
      }

      // Tab Management Event Listeners
      document.addEventListener("DOMContentLoaded", () => {
        // Setup tab switching
        document.querySelectorAll(".sidebar-tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            const tabName = tab.getAttribute("data-tab");
            switchTab(tabName);
          });
        });
      });

      // Initialize the app - check for saved credentials on page load
      document.addEventListener("DOMContentLoaded", () => {
        console.log("🚀 App initializing...");

        // Check if user is already logged in via cookies
        if (!checkSavedCredentials()) {
          console.log("ℹ️ No saved credentials found, showing login form");
        }
      });
    </script>
